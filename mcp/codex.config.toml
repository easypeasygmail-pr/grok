# Fragment do ~/.codex/config.toml albo do zaufanego .codex/config.toml projektu.
# Nie wklejaj tokenów. Figma i Mobbin logują się przez OAuth w przeglądarce.

[mcp_servers.mobile-mcp]
command = "npx"
args = ["-y", "@mobilenext/mobile-mcp@latest"]

[mcp_servers.mobile-mcp.env]
MOBILEMCP_DISABLE_TELEMETRY = "1"

[mcp_servers.figma]
url = "https://mcp.figma.com/mcp"

[mcp_servers.mobbin]
url = "https://api.mobbin.com/mcp"
