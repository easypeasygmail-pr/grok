name: Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK
        run: |
          set -euo pipefail
          # ubuntu-latest already ships the SDK (ANDROID_HOME / ANDROID_SDK_ROOT).
          # Downloading commandlinetools and piping `yes` into `sdkmanager --licenses`
          # fails the step: sdkmanager exits, `yes` gets SIGPIPE, and pipefail is on.
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "Preinstalled sdkmanager not found at $SDKMANAGER" >&2
            ls -la "$SDK" >&2 || true
            exit 1
          fi
          echo "Using preinstalled Android SDK at $SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          # Drop pipefail only for the license prompt. `yes` always dies with SIGPIPE.
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          set -o pipefail
          "$SDKMANAGER" --install \
            "platforms;android-37.1" \
            "build-tools;36.0.0"
          test -d "$SDK/platforms/android-37.1"
          test -d "$SDK/build-tools/36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build, unit tests, detekt, ktlint
        run: ./gradlew assembleDebug test detekt ktlintCheck --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: odpisz-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
